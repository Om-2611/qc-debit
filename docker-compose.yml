services:
  db:
    image: postgres:16-alpine
    container_name: dalmia-qc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dalmia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dalmia_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dalmia_qc}
      TZ: Asia/Kolkata
    ports:
      # Host port 5433 so it does not collide with any other local Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dalmia_qc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dalmia} -d ${POSTGRES_DB:-dalmia_qc}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dalmia_qc_pgdata:
